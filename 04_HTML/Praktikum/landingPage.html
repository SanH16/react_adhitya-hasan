<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page</title>
    <style>
      * {
        font-family: "Times New Roman", Times, serif;
        color: #000;
        font-style: normal;
        line-height: normal;
        /* border: 1px solid blue; */
      }
      h1,
      p {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex-shrink: 0;
        width: 400px;
        padding: 0px 0px 0px 12px;
        margin: 0px;
      }
      h1 {
        height: 125px;
      }
      p {
        color: rgba(0, 0, 0, 0.6);
        font-size: 17px;
        font-weight: 400;
        height: 63.797px;
      }
      h3 {
        color: var(--bs-dark, #212529);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.32px;
        width: 951px;
        padding: 0px 12px;
      }
      .simple-header {
        font-family: "Roboto";
      }
      .container,
      .news {
        padding-left: 82px;
      }
      button {
        display: flex;
        padding: 9px 28.359px 12px 28px;
        align-items: flex-start;
        cursor: pointer;
      }
      .contain {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 25px;
        padding: 60px 12px 0px 12px;
      }
      label {
        text-align: center;
        width: 130px;
        /* height: 40px; */
        padding: 12px 12px;
        margin: 21px 0px;
      }
      input {
        display: flex;
        width: 38%;
        height: 31px;
        flex-shrink: 0;
        margin: 12px 12px;
      }
      .get-started {
        margin-left: 12px;
        margin-top: 30px;
        margin-bottom: 60px;
      }
      img {
        margin: 24px 0px;
      }
      h5 {
        display: flex;
        width: 230px;
        height: 18px;
        flex-direction: row;
        margin-left: 82px;
        margin: 8px 0px 20px 82px;
        font-weight: 400;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <h3 class="simple-header">Simple header</h3>
    <hr />
    <div class="container">
      <div class="tittle">
        <h1>Better Solutions For Your Business</h1>
        <p>We are team of talented designers making websites with Bootstrap</p>
        <div class="contain">
          <button>
            <a style="text-decoration: none" href="createProduct.html"
              >Get Started</a
            >
          </button>
          <label for="" style="cursor: pointer">Watch Video</label>
        </div>
      </div>
      <img src="asset/asset-figma.png" alt="gambar" />
    </div>
    <div class="news">
      <h3>Join Our Newsletter</h3>
      <label for=""
        >Tamen quem nulla quae legam multos aute sint culpa legam noster
        magna</label
      >
      <input type="text" name="" id="" />
      <button class="get-started">
        <a style="text-decoration: none" href="createProduct.html"
          >Get Started</a
        >
      </button>
    </div>
    <hr />
    <footer>
      <h5>©️Copyright <strong>Adhitya. </strong>All Right Reserved</h5>
      <h5>Designed by SanTech</h5>
    </footer>
  </body>
</html>
